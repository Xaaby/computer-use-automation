[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "computer-use-automation"
version = "1.0.0"
description = "Computer-Use Automation System for interface.ai take-home"
requires-python = ">=3.11"
dependencies = [
    # AWS Bedrock (LLM provider)
    "boto3>=1.34.0",
    "botocore>=1.34.0",

    # Browser automation
    "playwright>=1.47.0",

    # Web framework (mock bank app)
    "flask>=3.0.0",
    "flask-session>=0.8.0",

    # API framework (operator console)
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "starlette>=0.40.0,<0.42.0",
    "python-multipart>=0.0.12",

    # Data validation (artifact schema)
    "pydantic>=2.9.0",

    # Environment variables
    "python-dotenv>=1.0.0",

    # YAML parsing (for aria_snapshot output)
    "pyyaml>=6.0.2",

    # UUID generation
    "uuid7>=0.1.0",

    # Testing
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-playwright>=0.5.0",
    "httpx>=0.27.0",  # for FastAPI test client

    # MCP server exposure
    "mcp>=2.0.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["agent", "artifact", "capability", "replay", "escalation", "policy", "surfaces", "evals"]
