{% extends "base.html" %}
{% block title %}Log in — Mock Core Admin{% endblock %}
{% block content %}
<div class="panel">
  <h1>Log in</h1>
  {% if expired %}
  <p class="flash">Your session has expired. Please log in again.</p>
  {% endif %}
  {% if error %}
  <p class="flash">{{ error }}</p>
  {% endif %}
  <form method="post" action="{{ url_for('login') }}">
    <input type="hidden" name="next" value="{{ next_url }}">
    <label for="username">Username</label>
    <input id="username" type="text" name="username" aria-label="Username" autocomplete="username">
    <label for="password">Password</label>
    <input id="password" type="password" name="password" aria-label="Password" autocomplete="current-password">
    <div>
      <button type="submit">Log in</button>
    </div>
  </form>
</div>
{% endblock %}
